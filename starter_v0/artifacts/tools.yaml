tools:
  - name: clarify
    description: "Ask the user a clarifying question and wait for their response. Use when required information is missing (e.g., no Twitter handle, no URL). Do NOT guess missing info. Use response_type='yes_no' to confirm before destructive actions like sending/posting."
    parameters:
      type: object
      properties:
        question: {type: string, description: "The clarifying question to ask the user"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Expected response type: 'text' for open answers, 'yes_no' for confirmation, 'choice' for multiple choice"}
        options: {type: array, default: [], items: {type: string}, description: "Options for choice type"}
      required: [question]

  - name: timeline
    description: "Get recent tweets from a SPECIFIC Twitter account. Requires the Twitter handle (screenname) like 'sama' for Sam Altman, 'elonmusk' for Elon Musk. Use ONLY when user asks about tweets FROM a specific person. If no handle is given, use clarify first."
    parameters:
      type: object
      properties:
        screenname: {type: string, description: "Twitter handle without @ (e.g., 'sama', 'elonmusk', 'karpathy')"}
        limit: {type: integer, default: 5, description: "Number of tweets to retrieve (default 5)"}
      required: [screenname]

  - name: social_search
    description: "Search Twitter for tweets ABOUT A TOPIC or keyword. Use when user asks what people are saying about a subject, NOT tweets from a specific person. Use search_type='Top' for popular/trending tweets, 'Latest' for most recent."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Search keyword or topic"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Latest for recent tweets, Top for popular/trending tweets. Use Top when user says 'phổ biến', 'top', 'popular', 'trending'"}
        limit: {type: integer, default: 5, description: "Number of results"}
      required: [query]

  - name: lookup
    description: "Search the web for news or general information using Tavily. Use for web news, current events, and general knowledge queries. NOT for Twitter. Always set topic='news' for news/current events. Set timeframe based on user context: 'hôm nay/today' → day, 'tuần này/this week' → week. Query should be the core search term (e.g., 'AI', not 'AI news')."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Core search query (just the topic, e.g., 'AI', 'robotics', not 'AI news')"}
        topic: {type: string, enum: [general, news], default: "general", description: "Use 'news' for current events and news, 'general' for general knowledge"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Time window: day=today, week=this week, month=this month. Infer from user context"}
        max_results: {type: integer, default: 5, description: "Number of results to return"}
      required: [query]

  - name: fetch
    description: "Read and extract content from a SPECIFIC URL provided by the user. Use ONLY when the user gives an explicit URL. Never guess or invent URLs — if no URL is provided, use clarify to ask for one."
    parameters:
      type: object
      properties:
        url: {type: string, description: "The exact URL to fetch (must be provided by user, never guessed)"}
      required: [url]

  - name: format
    description: "Format collected items into a structured markdown digest. Use AFTER gathering data from other tools. Supports templates: brief, sections, bullets, thread, daily_ai_vn."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "List of items with title, url, source, summary, section fields"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Output template format"}
        headline: {type: string, default: "", description: "Headline for the digest"}
      required: [items, template]

  - name: send
    description: "Post text to Telegram channel. IMPORTANT: Only call with confirmed=true AFTER the user has explicitly confirmed they want to send. If not yet confirmed, use clarify with response_type='yes_no' first to ask for confirmation."
    parameters:
      type: object
      properties:
        text: {type: string, description: "The text content to send"}
        confirmed: {type: boolean, default: false, description: "Must be true to actually send. Set false if user hasn't confirmed yet"}
      required: [text]

  - name: policy
    description: "Search internal company policy documents. Use when user asks about company policies, rules, or guidelines. Set policy_area to narrow search: ai_research, source_citation, data_privacy, external_publishing, tool_usage."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Policy search query"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Policy category to search in"}
        top_k: {type: integer, default: 3, description: "Number of policy sections to return"}
      required: [query]

  - name: papers
    description: "Search for academic papers on arXiv. Use when user asks about research papers, preprints, or academic publications. NOT for web news or tweets."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Paper search query"}
        max_results: {type: integer, default: 5, description: "Number of papers to return"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sort order for results"}
      required: [query]

  - name: paper_text
    description: "Download and extract text from an arXiv paper PDF. Use when user provides an arXiv ID (e.g., '1706.03762') or URL and wants to read the paper content."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, description: "arXiv paper ID (e.g., '1706.03762') or full arXiv URL"}
        max_pages: {type: integer, default: 5, description: "Maximum number of pages to extract"}
        max_chars: {type: integer, default: 8000, description: "Maximum characters to return"}
      required: [arxiv_url]

  - name: bookmark
    description: "Save research items (articles, tweets, papers) to a local bookmark file for later reference. Use when user wants to save/bookmark items. Supports actions: 'add' to save a new item, 'list' to view all bookmarks, 'remove' to delete a bookmark by ID."
    parameters:
      type: object
      properties:
        title: {type: string, description: "Title of the item to bookmark"}
        url: {type: string, description: "URL of the item"}
        note: {type: string, default: "", description: "Optional note about the item"}
        tags: {type: array, default: [], items: {type: string}, description: "Tags for categorization"}
        action: {type: string, enum: [add, list, remove], default: "add", description: "Action to perform: add new bookmark, list all, or remove by ID"}
        bookmark_id: {type: integer, description: "ID of bookmark to remove (required for remove action)"}
      required: []

  - name: summarize
    description: "Summarize long text into a shorter version. Use when user wants to condense articles, tweets, or research findings. Supports styles: 'brief' (truncate), 'bullets' (bullet points), 'key_points' (numbered list)."
    parameters:
      type: object
      properties:
        text: {type: string, description: "The text to summarize"}
        max_length: {type: integer, default: 200, description: "Maximum number of words in summary"}
        style: {type: string, enum: [brief, bullets, key_points], default: "brief", description: "Summary style: brief truncation, bullet points, or numbered key points"}
      required: [text]

  - name: export
    description: "Export research items to a file (markdown or JSON). Use when user wants to save research results to a file for later reference or sharing."
    parameters:
      type: object
      properties:
        items:
          type: array
          description: "List of research items to export"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
        filename: {type: string, default: "", description: "Output filename (auto-generated if empty)"}
        format: {type: string, enum: [markdown, json], default: "markdown", description: "Output format"}
        title: {type: string, default: "Research Digest", description: "Title for the export document"}
      required: [items]

  - name: compare
    description: "Compare two text sources for similarity and differences. Analyzes word overlap, unique terms, and provides a similarity score. Use when user wants to compare articles, tweets, or research findings from different sources."
    parameters:
      type: object
      properties:
        source_a: {type: string, description: "First text source to compare"}
        source_b: {type: string, description: "Second text source to compare"}
        label_a: {type: string, default: "Source A", description: "Label for first source"}
        label_b: {type: string, default: "Source B", description: "Label for second source"}
      required: [source_a, source_b]
