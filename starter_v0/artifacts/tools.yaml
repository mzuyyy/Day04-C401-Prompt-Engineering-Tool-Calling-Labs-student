# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Team tools ----------------
  - name: summarize_url
    description: "Tóm tắt một URL cụ thể thành markdown. Chỉ dùng khi user cung cấp URL rõ ràng; nếu thiếu URL thì dùng clarify."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL cần đọc và tóm tắt"}
        summary_style: {type: string, enum: [brief, bullets, detailed], default: "brief", description: "Kiểu tóm tắt"}
        language: {type: string, enum: [vi, en], default: "vi", description: "Ngôn ngữ đầu ra"}
        max_points: {type: integer, default: 5, description: "Số ý chính tối đa"}
      required: [url]

  - name: credibility_check
    description: "Đánh giá nhanh độ tin cậy của một nguồn hoặc claim phục vụ research triage. Không thay thế fact-check đầy đủ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL hoặc nguồn cần đánh giá"}
        claim: {type: string, default: "", description: "Claim cụ thể cần kiểm tra nếu có"}
        check_depth: {type: string, enum: [quick, standard], default: "standard", description: "Mức kiểm tra heuristic"}
      required: []

  - name: digest_builder
    description: "Tạo research digest, executive brief hoặc bản tin có cấu trúc. Phải gọi tool này khi user yêu cầu digest/brief/bản tin/gom thành, kể cả khi trước đó đã gọi lookup/social_search/papers để thu thập nguồn. Tool này không tự fetch dữ liệu mới."
    parameters:
      type: object
      properties:
        topic: {type: string, default: "", description: "Chủ đề digest"}
        sources:
          type: array
          default: []
          items: {type: string, enum: [web, social, papers, policy, url]}
          description: "Nhóm nguồn đã dùng hoặc muốn đưa vào digest"
        language: {type: string, enum: [vi, en], default: "vi", description: "Ngôn ngữ đầu ra"}
        template: {type: string, enum: [daily_ai_vn, executive, research_brief], default: "research_brief", description: "Khuôn digest"}
        max_items: {type: integer, default: 5, description: "Số item tối đa"}
        items:
          type: array
          default: []
          description: "Các item đã có để đưa vào digest"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
      required: [topic]
